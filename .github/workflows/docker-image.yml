# Builds the server's Docker image and publishes it to GitHub Container Registry, so TrueNAS (or any
# Docker host) can pull it instead of building from source.
#
#   push to main     -> ghcr.io/<owner>/checkers-server:latest  (production)
#   push to Staging  -> ghcr.io/<owner>/checkers-server:staging
#   every published build is also tagged sha-<short commit>, to pin or roll back to an exact build.
#   pull requests    -> the image is built to check the Dockerfile, but not published.
#
# Only server-side changes trigger it; the MAUI client isn't part of the image.
name: Docker image

on:
  push:
    branches: [main, Staging]
    paths:
      - "Shared/**"
      - "Domain/**"
      - "Persistence/**"
      - "Application/**"
      - "Server/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
  pull_request:
    branches: [main, Staging]
    paths:
      - "Shared/**"
      - "Domain/**"
      - "Persistence/**"
      - "Application/**"
      - "Server/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/checkers-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/Staging' }}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
